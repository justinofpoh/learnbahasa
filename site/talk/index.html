<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Open in Learn Bahasa</title>
  <meta name="description" content="This chat lives in the Learn Bahasa app for iPhone.">
  <meta name="theme-color" content="#F6F1E8">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/"><img src="/assets/apple-touch-icon.png" alt="">Learn Bahasa</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero" style="padding-top:0">
      <div class="hero-face" aria-hidden="true">
        <img id="face" src="/assets/face-ibu-wayan.png" alt="" width="168" height="168">
        <div class="typing"><i></i><i></i><i></i></div>
        <div class="bubble" id="hello">Halo!</div>
      </div>
      <h1 id="title" style="font-size:clamp(30px,7vw,46px)">This chat lives in the app</h1>
      <p class="sub" id="sub">Get Learn Bahasa on your iPhone, then tap the link again to jump straight in.</p>
      <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center">
        <a class="store" href="/#soon" aria-label="Coming soon to the App Store">
          <svg viewBox="0 0 384 512" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
          <span><small>Coming soon to the</small><b>App Store</b></span>
        </a>
      </div>
      <p style="margin-top:18px"><a id="web" href="/learn/" style="font-weight:800">Learn free in your browser →</a></p>
      <p style="margin-top:8px"><a id="open" href="bahasa://talk/" style="font-weight:650;color:var(--ink-soft)">Already have it? Open in Learn Bahasa</a></p>
      <div class="hero-art"><img id="art" src="/assets/chat-hill.png" alt="" width="1200" height="700"></div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <span>© 2026 Learn Bahasa</span>
      <nav><a href="/">Home</a><a href="/support/">Support</a><a href="/privacy/">Privacy</a></nav>
    </div>
  </footer>

  <script>
    (function () {
      var scenes = {
        "id.warung.lunch": ["ibu-wayan", "warung", "Lunch at Ibu Wayan's warung"],
        "id.jalan.ojek":   ["pak-agus", "jalan", "A ride with Pak Agus"],
        "id.pasar.sarong": ["bu-ketut", "pasar", "Haggling with Bu Ketut"],
        "id.kos.kamar":    ["bu-sari", "kos", "Renting a room from Bu Sari"],
        "id.teman.ngopi":  ["putu", "ngopi", "Coffee with Putu"],
        "id.laundry.kiloan": ["mbok-kadek", "laundry", "Laundry with Mbok Kadek"],
        "id.apotek.obat":  ["mbak-rina", "apotek", "At the pharmacy with Mbak Rina"],
        "id.bengkel.ban":  ["bli-made", "bengkel", "A flat tyre at Bli Made's"],
        "id.tetangga.mampir": ["pak-nyoman", "tetangga", "Pak Nyoman drops by"]
      };
      var legacy = { s1: "id.warung.lunch", s2: "id.pasar.sarong", s3: "id.jalan.ojek", s4: "id.kos.kamar", s5: "id.teman.ngopi" };
      var id = decodeURIComponent(location.pathname.replace(/^\/talk\/?/, "").replace(/\/+$/, ""));
      id = legacy[id] || id;
      var s = scenes[id];
      if (!s) return;
      document.getElementById("face").src = "/assets/face-" + s[0] + ".png";
      document.getElementById("art").src = "/assets/place-" + s[1] + ".png";
      document.getElementById("title").textContent = s[2];
      document.title = s[2] + " · Learn Bahasa";
      document.getElementById("open").href = "bahasa://talk/" + encodeURIComponent(id);
      {
        var web = document.getElementById("web");
        web.href = "/learn/#/chat/" + id;
        web.textContent = "Practise this chat free in your browser →";
      }
    })();
  </script>
</body>
</html>
